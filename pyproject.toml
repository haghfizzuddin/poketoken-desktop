[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poketoken-desktop"
version = "0.1.0"
description = "PokeTokenBar for WSL, Linux and Windows — your Claude Code tokens, hatched into Pokémon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]
keywords = ["claude-code", "pokemon", "token-usage", "wsl", "tkinter"]
classifiers = [
    "Environment :: X11 Applications",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]

[project.optional-dependencies]
audit = ["python-xlib"]

[project.scripts]
poketoken = "poketoken.cli:main"

[project.urls]
Homepage = "https://github.com/haghfizzuddin/poketoken-desktop"
Upstream = "https://github.com/chattymin/PokeTokenBar"

[tool.setuptools]
packages = ["poketoken"]
